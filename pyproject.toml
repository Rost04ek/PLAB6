[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "application"
version = "0.1.0"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --cov=application --cov-branch --cov-report=term-missing"
markers = [
    "integration: integration tests",
    "asyncio: async tests"
]

[tool.coverage.run]
branch = true
source = ["application"]

[tool.coverage.report]
show_missing = true
