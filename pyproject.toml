[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "application"
version = "1.0.0"
description = "Система керування завданнями (Лабораторна робота №6, Варіант 14)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "integration: integration tests",
    "slow: slow tests",
]

[tool.coverage.run]
branch = true
source = [
    "application",
    "task_manager",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
