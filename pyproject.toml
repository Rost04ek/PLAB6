[build-system]
requires = ["setuptools>=42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "application"
version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=application --cov-branch --cov-report=term-missing"
markers = [
    "integration: integration tests"
]

[tool.coverage.run]
branch = true
source = ["application"]

[tool.coverage.report]
show_missing = true
